  <script>
    (function () {
      const ID = "05-tablero";
      const $ = (id) => document.getElementById("f05-tablero-" + id);

      // --- geometry (baked; all absolute px, no layout reads) ---
      const BOARD_X = 60, BOARD_Y = 560;        // board frame origin on canvas
      const S0 = 960 / 1640;                     // tablet capture -> board scale
      const SHOT_Y = -439;                       // tablet crop offset inside board
      const CARD_SRC_W = 430;                    // ADI card crop width (source px)
      // ADI-388 card position inside the tablet capture (source px)
      const CARD_LX = 1179 * S0;
      const CARD_LY = 1011 * S0 + SHOT_Y;

      // zoomed camera: card lands at canvas (420, 900) at 560px wide
      const ZOOM_W = 560;
      const S1 = ZOOM_W / (CARD_SRC_W * S0);
      const TX1 = 420 - BOARD_X - S1 * CARD_LX;
      const TY1 = 900 - BOARD_Y - S1 * CARD_LY;

      // handoff_out: centered x, center y = 62% of 1920, 1.25x its board size
      const FINAL_W = ZOOM_W * 1.25;             // 700
      const FINAL_K = FINAL_W / CARD_SRC_W;
      const FINAL_H = 398 * FINAL_K;
      const FINAL_X = 540 - FINAL_W / 2;         // 190
      const FINAL_Y = 1920 * 0.62 - FINAL_H / 2;

      // single camera state, single writer
      const cam = { S: 1, tx: 0, ty: 0, pop: 0 };
      const world = $("world");
      const hero = $("hero");
      function applyCamera() {
        world.style.transform = "translate(" + cam.tx + "px," + cam.ty + "px) scale(" + cam.S + ")";
        const bx = BOARD_X + cam.tx + cam.S * CARD_LX;
        const by = BOARD_Y + cam.ty + cam.S * CARD_LY;
        const bk = cam.S * S0;
        const p = cam.pop;
        const x = bx + (FINAL_X - bx) * p;
        const y = by + (FINAL_Y - by) * p;
        const k = bk + (FINAL_K - bk) * p;
        hero.style.transform = "translate(" + x + "px," + y + "px) scale(" + k + ")";
      }
      applyCamera();

      const tl = gsap.timeline({ paused: true, onUpdate: applyCamera });

      // Scene 1 (0.0–1.5): headline
      tl.fromTo($("l1"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo($("l2"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.45);

      // board rises in underneath (overview)
      tl.fromTo($("stage"), { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.4);

      // Scene 2 (1.5–3.5): camera pushes to "Esperando aprobación" + depth of field
      tl.fromTo(cam, { S: 1, tx: 0, ty: 0 }, { S: S1, tx: TX1, ty: TY1, duration: 1.9, ease: "power3.inOut", immediateRender: false }, 1.5);
      tl.fromTo($("shot"), { "--dof": "0px", opacity: 1 }, { "--dof": "5px", opacity: 0.55, duration: 1.6, ease: "power2.inOut" }, 1.8);

      // Scene 3 (3.5–5.0): ADI-388 lifts to the front, yellow border draws
      tl.fromTo(cam, { pop: 0 }, { pop: 1, duration: 1.1, ease: "power3.out", immediateRender: false }, 3.5);
      tl.fromTo(hero,
        { boxShadow: "0 0px 0px rgba(15,23,42,0)" },
        { boxShadow: "0 40px 90px rgba(15,23,42,0.28)", duration: 1.1, ease: "power2.out" }, 3.5);
      tl.fromTo($("ring-rect"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power2.inOut" }, 3.7);

      // Scene 4 (5.0–6.0): "A la vista." enters in blue; then everything still
      tl.fromTo($("l3"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 5.0);

      tl.set({}, {}, 6);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
